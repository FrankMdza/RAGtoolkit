version: '3.8'

services:
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    volumes:
      - ./core:/app
      - ./data:/app/data
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    volumes:
      - ./agent:/app
      - ./data:/app/data
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - LOGFIRE_API_KEY=${LOGFIRE_API_KEY}
    depends_on:
      - core
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    restart: unless-stopped

volumes:
  data: 